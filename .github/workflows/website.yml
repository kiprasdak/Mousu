name: Publish Mousü website

# Publishing is an explicit action; commits never deploy this site automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mousu-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Read existing Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Validate and stage public website files
        run: python3 website/check.py --output "$RUNNER_TEMP/mousu-pages"
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/mousu-pages

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
